name: Desktop
run-name: Desktop ${{ inputs.upstream_tag || 'latest' }} ${{ inputs.request_id || github.run_id }}

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official Release tag; blank selects the highest complete SemVer including prereleases'
        required: false
        type: string
        default: ''
      request_id:
        description: 'CLI request identifier'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-release-pipeline
  cancel-in-progress: false

env:
  DSH_DESKTOP_REPO: ${{ github.repository }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test automation
        run: python3 -B -m unittest discover -s tests -v
      - name: Resolve upstream Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: bash scripts/resolve.sh

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
      BUILD_UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      BUILD_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      DSH_GATE_CONCURRENCY: '1'
      DSH_GATE_FAIL_FAST: '1'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install the source-pinned pnpm JavaScript package
        shell: bash
        run: |
          pnpm_version=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const packageManager = JSON.parse(readFileSync("source/package.json", "utf8")).packageManager; if (!packageManager?.startsWith("pnpm@")) process.exit(1); process.stdout.write(packageManager.slice(5).split("+")[0]);')
          npm install --prefix "$RUNNER_TEMP/pnpm" --no-audit --no-fund "pnpm@$pnpm_version"
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pnpm/node_modules/.bin/pnpm" --version
      - name: Check source and runner
        id: paths
        shell: bash
        run: |
          case "$BUILD_ARCH:$(uname -m)" in
            arm64:arm64|x64:x86_64) ;;
            *) echo "Unexpected runner architecture: BUILD_ARCH=$BUILD_ARCH uname=$(uname -m)" >&2; exit 1 ;;
          esac
          /bin/bash -n automation/bin/dsh-desktop
          node automation/scripts/metadata.mjs verify source
          df -h "$GITHUB_WORKSPACE"
          sysctl -n hw.memsize
          printf 'store=%s\n' "$(pnpm --dir source store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ steps.paths.outputs.store }}
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            source/apps/desktop/.desktop-build/downloads
          key: macos-${{ matrix.arch }}-node24-${{ hashFiles('source/pnpm-lock.yaml', 'source/pnpm-workspace.yaml', 'source/scripts/primary-runtime/lock.json') }}
      - name: Install locked dependencies
        shell: bash
        run: pnpm --dir source install --frozen-lockfile
      - name: Select official client branding for the personal build
        run: node automation/scripts/official-ui.mjs apply source
      - name: Build official Desktop without Developer ID
        shell: bash
        run: |
          pnpm --dir source run "package:desktop:mac:$BUILD_ARCH:unsigned" --check
          pnpm --dir source run "package:desktop:mac:$BUILD_ARCH:unsigned" 2>&1 | tee "$RUNNER_TEMP/desktop-build.log"
      - name: Verify application and record provenance
        shell: bash
        run: |
          application="source/apps/desktop/.desktop-build/targets/mac-$BUILD_ARCH/unsigned-artifacts/mac-$BUILD_ARCH/DeepSeek Harness.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$application/Contents/Info.plist")" = "$BUILD_VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$application/Contents/Info.plist")" = com.deepseek.harness
          executable=$(plutil -extract CFBundleExecutable raw -o - "$application/Contents/Info.plist")
          case "$BUILD_ARCH" in arm64) executable_arch=arm64 ;; x64) executable_arch=x86_64 ;; esac
          file "$application/Contents/MacOS/$executable" | grep -q "$executable_arch"
          codesign --verify --strict "$application"
          artifact="deepseek-harness-$BUILD_VERSION-mac-$BUILD_ARCH-unsigned.dmg"
          mkdir package
          mv "source/apps/desktop/.desktop-build/targets/mac-$BUILD_ARCH/unsigned-artifacts/$artifact" "package/$artifact"
          node automation/scripts/metadata.mjs record source "package/$artifact" package
          cp source/.dsh-build/client-build-environment.json package/client-build-environment.json
          (cd package && shasum -a 256 -c "SHA256SUMS-$BUILD_ARCH")
          du -sh package source/apps/desktop/.desktop-build
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-package-${{ matrix.arch }}
          path: package/*
          if-no-files-found: error
          retention-days: 1
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-diagnostics-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/apps/desktop/.desktop-build/packaging-runs/
            ${{ runner.temp }}/desktop-build.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [resolve, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
      BUILD_UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      BUILD_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      BUILD_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: downloaded
      - name: Assemble both verified architecture packages
        shell: bash
        run: |
          mkdir package
          for arch in arm64 x64; do
            cp "downloaded/desktop-package-$arch/deepseek-harness-$BUILD_VERSION-mac-$arch-unsigned.dmg" package/
            cp "downloaded/desktop-package-$arch/build-info-$arch.json" package/
            cp "downloaded/desktop-package-$arch/SHA256SUMS-$arch" package/
          done
      - name: Publish verified personal build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh package

  maintain:
    needs: [resolve, build, publish]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Maintain schedule activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/keepalive.sh
