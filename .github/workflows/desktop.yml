name: Desktop
run-name: Desktop ${{ inputs.upstream_tag || 'latest' }} ${{ inputs.request_id || github.run_id }}

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official Release tag; blank selects the highest complete SemVer including prereleases'
        required: false
        type: string
        default: ''
      request_id:
        description: 'CLI request identifier'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-release-pipeline
  cancel-in-progress: false

env:
  DSH_DESKTOP_REPO: ${{ github.repository }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test automation
        run: python3 -B -m unittest discover -s tests -v
      - name: Resolve upstream Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: bash scripts/resolve.sh

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
      BUILD_UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      BUILD_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      DSH_GATE_CONCURRENCY: '1'
      DSH_GATE_FAIL_FAST: '1'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: source/package.json
          dest: ${{ runner.temp }}/setup-pnpm
          run_install: false
      - name: Check source and runner
        id: paths
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          /bin/bash -n automation/bin/dsh-desktop
          node automation/scripts/metadata.mjs verify source
          df -h "$GITHUB_WORKSPACE"
          sysctl -n hw.memsize
          printf 'store=%s\n' "$(pnpm --dir source store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ steps.paths.outputs.store }}
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            source/apps/desktop/.desktop-build/downloads
          key: macos-arm64-node24-${{ hashFiles('source/pnpm-lock.yaml', 'source/pnpm-workspace.yaml', 'source/scripts/primary-runtime/lock.json') }}
      - name: Install locked dependencies
        shell: bash
        run: pnpm --dir source install --frozen-lockfile
      - name: Build official Desktop without Developer ID
        shell: bash
        run: |
          pnpm --dir source run package:desktop:mac:arm64:unsigned --check
          pnpm --dir source run package:desktop:mac:arm64:unsigned 2>&1 | tee "$RUNNER_TEMP/desktop-build.log"
      - name: Verify application and record provenance
        shell: bash
        run: |
          application="source/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/mac-arm64/DeepSeek Harness.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$application/Contents/Info.plist")" = "$BUILD_VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$application/Contents/Info.plist")" = com.deepseek.harness
          codesign --verify --strict "$application"
          artifact="deepseek-harness-$BUILD_VERSION-mac-arm64-unsigned.dmg"
          mkdir package
          mv "source/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/$artifact" "package/$artifact"
          node automation/scripts/metadata.mjs record source "package/$artifact" package
          (cd package && shasum -a 256 -c SHA256SUMS)
          du -sh package source/apps/desktop/.desktop-build
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-package
          path: package/*
          if-no-files-found: error
          retention-days: 1
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/apps/desktop/.desktop-build/packaging-runs/
            ${{ runner.temp }}/desktop-build.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
      BUILD_UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      BUILD_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      BUILD_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-package
          path: package
      - name: Publish verified personal build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh package

  maintain:
    needs: [resolve, build, publish]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Maintain schedule activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/keepalive.sh
