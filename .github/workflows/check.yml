name: Check automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate shell and JavaScript syntax
        run: |
          bash -n bin/dsh-desktop scripts/resolve.sh scripts/publish.sh scripts/keepalive.sh
          node --check scripts/metadata.mjs
      - name: Test version selection and installation recovery
        run: python3 -B -m unittest discover -s tests -v
